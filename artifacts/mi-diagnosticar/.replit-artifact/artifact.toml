kind = "web"
previewPath = "/"
title = "Mi Diagnosticar Core"
version = "1.0.0"
id = "artifacts/mi-diagnosticar"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20469

[services.development]
run = "pnpm --filter @workspace/mi-diagnosticar run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mi-diagnosticar", "run", "build" ]
publicDir = "artifacts/mi-diagnosticar/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20469"
BASE_PATH = "/"
