      parameters:
        - name: sesionToken
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuardiaVirtualValidarTokenInput"
      responses:
        "200":
          description: Resultado de la validación del token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuardiaVirtualTokenValidacion"
        "400":
          description: Token inválido o datos faltantes
        "401":
          description: Clave de API inválida o faltante
        "404":
          description: Sesión no encontrada
        "410":
          description: Sesión expirada
        "503":
          description: Servicio de validación no disponible

  /publico/guardia-virtual/checkin/disponibilidad:
    get:
      operationId: guardiaVirtualCheckinHorarios
      tags: [publico]
      summary: Horarios libres de la agenda de guardia para reservar un turno Check in (requiere x-api-key)
      parameters:
        - name: guardia
          in: query
          required: false
          schema:
            type: string
            enum: [clinica, pediatrica]
        - name: fecha
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Horarios disponibles para esa fecha
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuardiaVirtualCheckinDisponibilidad"
        "400":
          description: Parámetros inválidos
        "401":
          description: Clave de API inválida o faltante
        "503":
          description: Guardia no disponible para reservas

  /publico/guardia-virtual/registros/{sesionToken}/estado:
    get:
      operationId: guardiaVirtualPollingEstado
      tags: [publico]
      summary: Polling del estado de la sesión (posición en fila, link Jitsi al ser llamado)
      parameters:
        - name: sesionToken
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Estado actual de la sesión
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuardiaVirtualSesionEstado"
        "401":
          description: Clave de API inválida o faltante
        "404":
          description: Sesión no encontrada
        "410":
          description: Sesión expirada

  /publico/guardia-virtual/registros/{sesionToken}/llegue:
    post:
      operationId: guardiaVirtualLlegue
      tags: [publico]
      summary: "Botón 'Ya llegué a la clínica' (solo modalidad presencial): pasa el turno de agendado a recepcionado para que el médico pueda llamarlo"
      parameters:
        - name: sesionToken
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Llegada registrada (idempotente si ya estaba recepcionado)
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                  yaEstaba:
                    type: boolean
                    nullable: true
        "401":
          description: Clave de API inválida o faltante
        "404":
          description: Sesión no encontrada
        "409":
          description: Sesión de videollamada, sin turno todavía, o turno ya no vigente

  /publico/guardia-virtual/registros/{sesionToken}/abandonar:
    post:
