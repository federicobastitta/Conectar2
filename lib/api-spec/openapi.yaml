        - name: sesionToken
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Sesión abandonada correctamente
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
        "401":
          description: Clave de API inválida o faltante
        "404":
          description: Sesión no encontrada

