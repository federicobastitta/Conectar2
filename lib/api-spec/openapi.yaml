openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Conectar API - Red clínica digital. Turnos, historia clínica, mensajes, sala de espera, informes, notificaciones y PACS.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Autenticación y sesión
  - name: sedes
    description: Sedes / centros de atención
  - name: especialidades
    description: Especialidades médicas
  - name: profesionales
    description: Médicos y profesionales de salud
  - name: obras-sociales
    description: Obras sociales / coberturas
  - name: caja
    description: Caja diaria - pagos particulares y cierres
  - name: consultorios
  - name: salas-llamado
    description: Consultorios físicos del centro
  - name: turneras
    description: Agendas / turneras
  - name: turnos
    description: Turnos / citas
  - name: pacientes
    description: Pacientes
  - name: historia-clinica
    description: Historia clínica electrónica
  - name: hce
    description: HCE estructurada - ficha, consultas, signos vitales, prescripciones, adjuntos
  - name: importacion
    description: Importación masiva de datos
  - name: dashboard
    description: Estadísticas y resúmenes
  - name: ai
    description: Inteligencia artificial - copiloto y asistente
  - name: openai
    description: OpenAI AI chat y conversaciones
  - name: consultorio
    description: Consultorio digital del profesional - agenda, producción y prácticas
  - name: sala-espera
    description: Admisión (check-in) y sala de espera - cola en tiempo real y llamador
  - name: derivacion
    description: Motor de derivación directa - catálogo de servicios, solicitudes y bandeja de recepción
  - name: notificaciones
    description: Notificaciones salientes al paciente (WhatsApp) auditadas
  - name: integraciones
    description: Integraciones con sistemas externos (Phir-it, Whaticket)
  - name: estadisticas
    description: Estadísticas médicas y tablero gerencial
  - name: publico
    description: API pública de turnos para integraciones externas (app propia, asistente virtual) - requiere clave en el header x-api-key
  - name: Storage
    description: Object storage upload and serving endpoints.
paths:
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
          description: Object path within the private object dir (e.g. `uploads/some-uuid`).
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to serve object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # --- BUSQUEDA RAPIDA ---
  /busqueda-rapida:
    get:
      tags: [busquedaRapida]
      operationId: busquedaRapida
      summary: Buscador rápido inteligente (especialidad, profesional o DNI)
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
      responses:
        "200":
          description: Resultado de la búsqueda rápida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusquedaRapidaResult"
        "401":
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  # --- AUTH ---
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Iniciar sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Credenciales inválidas

  /auth/ingreso-magico:
    post:
      operationId: ingresoMagico
      tags: [auth]
      summary: Ingreso del paciente por link mágico (token de un solo uso)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngresoMagicoInput"
      responses:
        "200":
          description: Sesión creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Token inválido
        "410":
          description: Token vencido, usado o revocado
        "429":
          description: Demasiados intentos

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Cerrar sesión
      responses:
        "200":
          description: OK

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Obtener usuario actual
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: No autenticado

  /auth/vista-rol:
    post:
      operationId: cambiarVistaRol
      tags: [auth]
      summary: Cambiar la vista de rol simulada (solo admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VistaRolInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Rol inválido
        "401":
          description: No autenticado
        "403":
          description: Solo admins pueden cambiar la vista

  # --- PERSONALIZACIÓN (preferencias del usuario logueado) ---
  /perfil/preferencias:
    get:
      operationId: getPreferenciasPerfil
      tags: [perfil]
      summary: Obtener preferencias personales del usuario actual
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreferenciasUsuario"
        "401":
          description: No autenticado
    put:
      operationId: updatePreferenciasPerfil
      tags: [perfil]
      summary: Guardar preferencias personales (marca la encuesta como completada)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreferenciasUsuarioInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreferenciasUsuario"
        "400":
          description: Datos inválidos
        "401":
          description: No autenticado

  /perfil/preferencias/cumple-visto:
    post:
      operationId: marcarCumpleVisto
      tags: [perfil]
      summary: Marcar el saludo de cumpleaños como visto por hoy
      responses:
        "200":
          description: OK
        "401":
          description: No autenticado

  # --- USUARIOS (perfiles) ---
  /usuarios:
    get:
      operationId: listUsuarios
      tags: [usuarios]
      summary: Listar usuarios (solo admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Usuario"
    post:
      operationId: createUsuario
      tags: [usuarios]
      summary: Crear usuario con perfil (solo admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsuarioInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
        "409":
          description: Email ya registrado

  /usuarios/{id}:
    patch:
      operationId: updateUsuario
      tags: [usuarios]
      summary: Actualizar usuario (solo admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsuarioUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
        "404":
          description: No encontrado

  # --- SEDES ---
  /sedes:
    get:
      operationId: listSedes
      tags: [sedes]
      summary: Listar sedes
      parameters:
        - name: activa
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sede"
    post:
      operationId: createSede
      tags: [sedes]
      summary: Crear sede
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SedeInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sede"

  /sedes/{id}:
    get:
      operationId: getSede
      tags: [sedes]
      summary: Obtener sede
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sede"
    patch:
      operationId: updateSede
      tags: [sedes]
      summary: Actualizar sede
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SedeUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sede"
    delete:
      operationId: deleteSede
      tags: [sedes]
      summary: Eliminar sede
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: No Content

  # --- ESPECIALIDADES ---
  /especialidades:
    get:
      operationId: listEspecialidades
      tags: [especialidades]
      summary: Listar especialidades
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Especialidad"
    post:
      operationId: createEspecialidad
      tags: [especialidades]
      summary: Crear especialidad
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EspecialidadInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Especialidad"

  /especialidades/{id}:
    patch:
      operationId: updateEspecialidad
      tags: [especialidades]
      summary: Actualizar especialidad
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EspecialidadUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Especialidad"
    delete:
      operationId: deleteEspecialidad
      tags: [especialidades]
      summary: Eliminar especialidad
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: No Content

  # --- OBRAS SOCIALES ---
  /obras-sociales:
    get:
      operationId: listObrasSociales
      tags: [obras-sociales]
      summary: Listar obras sociales
      parameters:
        - name: activa
          in: query
          required: false
          schema:
            type: boolean
        - name: q
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ObraSocial"
    post:
      operationId: createObraSocial
      tags: [obras-sociales]
      summary: Crear obra social
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObraSocialInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObraSocial"

  /obras-sociales/{id}:
    patch:
      operationId: updateObraSocial
      tags: [obras-sociales]
      summary: Actualizar obra social
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObraSocialUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObraSocial"
    delete:
      operationId: deleteObraSocial
      tags: [obras-sociales]
      summary: Eliminar obra social
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: No Content

  /nomenclador:
    get:
      operationId: listNomencladorPracticas
      tags: [obras-sociales]
      summary: Buscar prácticas del nomenclador valorizado (por obra social, o global sin repetir códigos)
      parameters:
        - name: obraSocialId
          in: query
          required: false
          schema:
            type: integer
        - name: buscar
          in: query
          required: false
          schema:
            type: string
        - name: limite
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NomencladorListado"

  /equivalencias:
    get:
      operationId: listEquivalencias
      tags: [obras-sociales]
      summary: Listar equivalencias (cobro obra social / pago profesional) por obra social
      parameters:
        - name: obraSocialId
          in: query
          required: true
          schema:
            type: integer
        - name: buscar
          in: query
          required: false
          schema:
            type: string
        - name: limite
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EquivalenciasListado"
    post:
      operationId: createEquivalencia
      tags: [obras-sociales]
      summary: Crear o actualizar la equivalencia de un código para una obra social
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EquivalenciaInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Equivalencia"

  /equivalencias/{id}:
    patch:
      operationId: updateEquivalencia
      tags: [obras-sociales]
      summary: Actualizar una equivalencia
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EquivalenciaUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Equivalencia"
    delete:
      operationId: deleteEquivalencia
      tags: [obras-sociales]
      summary: Eliminar una equivalencia
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: No Content

  /obras-sociales/{id}/nomenclador:
    delete:
      operationId: deleteNomencladorObraSocial
      tags: [obras-sociales]
      summary: Borrar el nomenclador cargado de una obra social
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: No Content

  # --- CONSULTORIOS ---
  /consultorios:
    get:
      operationId: listConsultorios
      tags: [consultorios]
      summary: Listar consultorios
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Consultorio"
    post:
      operationId: createConsultorio
      tags: [consultorios]
      summary: Crear consultorio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsultorioInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consultorio"

  /consultorios/{id}:
    patch:
      operationId: updateConsultorio
      tags: [consultorios]
      summary: Actualizar consultorio
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsultorioUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consultorio"
    delete:
      operationId: deleteConsultorio
      tags: [consultorios]
      summary: Eliminar consultorio
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: No Content

  # --- SALAS DE LLAMADO (salas de espera con pantalla TV) ---
  /salas-llamado:
    get:
      operationId: listSalasLlamado
      tags: [salas-llamado]
      summary: Listar salas de llamado
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SalaLlamado"
    post:
      operationId: createSalaLlamado
      tags: [salas-llamado]
      summary: Crear sala de llamado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SalaLlamadoInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalaLlamado"

  /salas-llamado/{id}:
    patch:
      operationId: updateSalaLlamado
      tags: [salas-llamado]
      summary: Actualizar sala de llamado
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SalaLlamadoUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalaLlamado"
    delete:
      operationId: deleteSalaLlamado
      tags: [salas-llamado]
      summary: Eliminar sala de llamado
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: No Content

  # --- CAJA ---
  /caja/resumen:
    get:
      operationId: getCajaResumen
      tags: [caja]
      summary: Resumen de caja del día (movimientos, totales por profesional, cierre)
      parameters:
        - name: fecha
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CajaResumen"

  /caja/movimientos:
    post:
      operationId: createCajaMovimiento
      tags: [caja]
      summary: Registrar pago en caja
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CajaMovimientoInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CajaMovimiento"

  /caja/movimientos/{id}:
    delete:
      operationId: deleteCajaMovimiento
      tags: [caja]
      summary: Anular movimiento de caja
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: No Content

  /caja/cierres:
    post:
      operationId: cerrarCaja
      tags: [caja]
      summary: Finalizar caja del día
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CajaCierreInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CajaCierre"

  # --- REPORTES ESTADISTICOS ---
  /estadisticas/reportes:
    get:
      operationId: listReportes
      tags: [estadisticas]
      summary: Listar reportes estadísticos disponibles
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReporteInfo"

  /estadisticas/reporte:
    get:
      operationId: getReporte
      tags: [estadisticas]
      summary: Ejecutar un reporte estadístico entre fechas
      parameters:
        - name: clave
          in: query
          required: true
          schema:
            type: string
        - name: desde
          in: query
          required: true
          schema:
            type: string
        - name: hasta
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReporteResultado"

  # --- PROFESIONALES ---
  /profesionales:
    get:
      operationId: listProfesionales
      tags: [profesionales]
      summary: Listar profesionales
      parameters:
        - name: especialidadId
          in: query
          schema:
            type: integer
        - name: sedeId
          in: query
          schema:
            type: integer
        - name: activo
          in: query
          schema:
            type: boolean
        - name: q
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Profesional"
