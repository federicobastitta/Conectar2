        pacientesEnEspera:
          type: integer
          description: "Pacientes en espera hoy en esta agenda (turnos activos del día)"

    GuardiaVirtualCheckinDisponibilidad:
      type: object
      required: [guardia, fecha, horarios]
      properties:
        guardia:
          type: string
          enum: [clinica, pediatrica]
        fecha:
          type: string
