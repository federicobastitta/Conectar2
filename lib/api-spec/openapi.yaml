          nullable: true
        esperaEstimadaMinutos:
          type: number
          nullable: true
        jitsiUrl:
          type: string
          nullable: true
          description: "URL de Jitsi para la videollamada; solo presente cuando estado=llamado y modalidad=videollamada"
        nroBono:
          type: string
          nullable: true
        turnoFecha:
          type: string
          nullable: true
          description: "Fecha del turno (YYYY-MM-DD); si es futura, es un Check in reservado que todavía no está en la fila"
        turnoHora:
          type: string
          nullable: true
        modalidad:
          type: string
          enum: [videollamada, presencial]
        llegoALaClinica:
          type: boolean
          nullable: true
          description: "Solo modalidad presencial: false mientras el turno sigue agendado (mostrar botón 'Ya llegué'), true después de avisar que llegó"

    PublicoTurnoInput:
      type: object
      required: [turneraId, fecha, horaInicio, pacienteDni, pacienteNombre, pacienteApellido]
      properties:
        turneraId:
          type: integer
        fecha:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Fecha YYYY-MM-DD
        horaInicio:
          type: string
          pattern: '^\d{2}:\d{2}$'
        pacienteDni:
          type: string
          minLength: 7
        pacienteNombre:
          type: string
          minLength: 1
        pacienteApellido:
          type: string
          minLength: 1
        telefono:
          type: string
        email:
          type: string
        sexo:
          type: string
          description: Sexo del paciente (F, M o X) — requerido por Klinicos
        cobertura:
          type: string
          description: Obra social del paciente (o "Particular")
        nroAfiliado:
          type: string
          description: Número de afiliado de la obra social
        motivoConsulta:
          type: string
        regionAnatomica:
          type: string
          description: Región anatómica del estudio (obligatoria si la turnera es de práctica; ej. "Rodilla derecha")
        origen:
          type: string
          description: Identificador libre del canal que reserva (ej. "app", "asistente-web")

