      operationId: listKlinicosPracticas
      tags: [integraciones]
      summary: Catálogo de prácticas (códigos IOMA + efector). Solo staff.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KlinicosPractica"
    post:
      operationId: createKlinicosPractica
      tags: [integraciones]
      summary: Crear una práctica del catálogo. Solo admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KlinicosPracticaInput"
      responses:
        "201":
          description: Práctica creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KlinicosPractica"

  /integraciones/klinicos/practicas/{id}:
    patch:
      operationId: updateKlinicosPractica
      tags: [integraciones]
      summary: Editar una práctica del catálogo. Solo admin.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KlinicosPracticaInput"
      responses:
        "200":
          description: Práctica actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KlinicosPractica"

  /integraciones/klinicos/prescriptores:
    get:
      operationId: listKlinicosPrescriptores
      tags: [integraciones]
      summary: Médicos prescriptores para la rotación del robot Klinicos. Solo staff.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KlinicosPrescriptor"
    post:
      operationId: createKlinicosPrescriptor
      tags: [integraciones]
      summary: Agregar un prescriptor. Solo admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KlinicosPrescriptorInput"
      responses:
        "201":
          description: Prescriptor creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KlinicosPrescriptor"

  /integraciones/klinicos/prescriptores/{id}:
    patch:
      operationId: updateKlinicosPrescriptor
      tags: [integraciones]
      summary: Editar un prescriptor. Solo admin.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KlinicosPrescriptorInput"
      responses:
        "200":
          description: Prescriptor actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KlinicosPrescriptor"

  /videollamadas:
    post:
      operationId: crearVideollamada
      tags: [videollamadas]
      summary: Iniciar una videollamada con un paciente. Solo médicos/admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideollamadaCrearInput"
      responses:
        "201":
          description: Videollamada creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Videollamada"

  /videollamadas/activa:
    get:
      operationId: getVideollamadaActiva
      tags: [videollamadas]
      summary: Videollamada activa del médico logueado (o null).
      responses:
        "200":
          description: Videollamada activa o null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideollamadaActivaResponse"

  /videollamadas/paciente:
    get:
      operationId: getVideollamadaPaciente
      tags: [videollamadas]
      summary: Videollamada activa para el paciente logueado (o null).
      responses:
        "200":
          description: Videollamada activa o null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideollamadaActivaResponse"

  /videollamadas/{id}/finalizar:
    post:
      operationId: finalizarVideollamada
      tags: [videollamadas]
      summary: Finalizar una videollamada. Solo el médico que la creó o admin.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Videollamada finalizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Videollamada"

components:
  schemas:
    ValoracionesMedicoResumen:
      type: object
      required: [profesionalId, nombre, invitaciones, respuestas, comentarios, distribucion]
      properties:
        profesionalId:
          type: integer
        nombre:
          type: string
        especialidad:
          type: string
          nullable: true
        invitaciones:
          type: integer
        respuestas:
          type: integer
        promedio:
          type: number
          nullable: true
        comentarios:
          type: integer
        distribucion:
          type: object
          required: ["1", "2", "3", "4", "5"]
          properties:
            "1":
              type: integer
            "2":
              type: integer
            "3":
              type: integer
            "4":
              type: integer
            "5":
              type: integer
        ultimaRespuesta:
          type: string
          nullable: true
    ValoracionesMedicoDetalle:
      type: object
      required: [profesional, valoraciones]
      properties:
        profesional:
          type: object
          required: [id, nombre]
          properties:
            id:
              type: integer
            nombre:
              type: string
            especialidad:
              type: string
              nullable: true
        valoraciones:
          type: array
          items:
            type: object
            required: [id, puntaje, paciente]
            properties:
              id:
                type: integer
              puntaje:
                type: integer
              comentario:
                type: string
                nullable: true
              fecha:
                type: string
                nullable: true
              paciente:
                type: string
    VideollamadaCrearInput:
      type: object
      required: [pacienteId]
      properties:
        pacienteId:
          type: integer
    Videollamada:
      type: object
      required: [id, pacienteId, pacienteNombre, medicoNombre, sala, url, estado, creadaEn]
      properties:
        id:
          type: integer
        pacienteId:
          type: integer
        pacienteNombre:
          type: string
        medicoNombre:
          type: string
        sala:
          type: string
        url:
          type: string
        estado:
          type: string
          enum: [activa, finalizada]
        creadaEn:
          type: string
    VideollamadaActivaResponse:
      type: object
      properties:
        videollamada:
          $ref: "#/components/schemas/Videollamada"
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
        contentType:
          type: string
          minLength: 1
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          minLength: 1
        objectPath:
          type: string
        metadata:
          $ref: '#/components/schemas/UploadUrlRequest'
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    # --- BUSQUEDA RAPIDA ---
    BusquedaRapidaSlot:
      type: object
      required: [turneraId, turneraNombre, fecha, horaInicio]
      properties:
        turneraId:
          type: integer
        turneraNombre:
          type: string
        fecha:
          type: string
        horaInicio:
          type: string
        profesional:
          type: string
          nullable: true
        especialidad:
          type: string
          nullable: true
        sede:
          type: string
          nullable: true
    BusquedaRapidaTurnoPaciente:
      type: object
      required: [id, fecha, horaInicio, estado]
      properties:
        id:
          type: integer
        fecha:
          type: string
        horaInicio:
          type: string
        estado:
          type: string
        turneraNombre:
          type: string
          nullable: true
    BusquedaRapidaEstudioPaciente:
      type: object
      required: [origen, descripcion, estado]
      properties:
        origen:
          type: string
        descripcion:
          type: string
        estado:
          type: string
        fecha:
          type: string
          nullable: true
    BusquedaRapidaPaciente:
      type: object
      required: [id, nombre, apellido, turnos, estudios]
      properties:
        id:
          type: integer
        nombre:
          type: string
        apellido:
          type: string
        dni:
          type: string
          nullable: true
        turnos:
          type: array
          items:
            $ref: "#/components/schemas/BusquedaRapidaTurnoPaciente"
        estudios:
          type: array
          items:
            $ref: "#/components/schemas/BusquedaRapidaEstudioPaciente"
    BusquedaRapidaResult:
      type: object
      required: [tipo, consulta]
      properties:
        tipo:
          type: string
          enum: [slots, paciente, ninguno]
        consulta:
          type: string
        titulo:
          type: string
          nullable: true
        slots:
          type: array
          items:
            $ref: "#/components/schemas/BusquedaRapidaSlot"
        paciente:
          $ref: "#/components/schemas/BusquedaRapidaPaciente"

    # --- AUTH ---
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
          minLength: 4

    IngresoMagicoInput:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 20
          maxLength: 200

    AuthResponse:
      type: object
      required: [user, token]
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string

    User:
      type: object
      required: [id, email, nombre, rol]
      properties:
        id:
          type: integer
        email:
          type: string
        nombre:
          type: string
        rol:
          type: string
          enum: [admin, recepcionista, medico, paciente]
        profesionalId:
          type: ["integer", "null"]
        pacienteId:
          type: ["integer", "null"]
        perfil:
          type: ["string", "null"]
          enum: [administracion, administrador_caja, tecnico, medico, medico_consulta, medico_informante, medico_consulta_informante, gerente, desarrollador, null]
        vistaRol:
          type: ["string", "null"]
          description: Rol simulado activo ("ver como") — solo para admins
        puedeCambiarVista:
          type: boolean
          description: true si el usuario real es admin y puede usar el modo vista

    VistaRolInput:
      type: object
      required: [rol]
      properties:
        rol:
          type: ["string", "null"]
          enum: [recepcionista, medico, paciente, administracion, administrador_caja, tecnico, medico_consulta, medico_informante, medico_consulta_informante, gerente, desarrollador, null]
          description: Rol o perfil funcional a simular; null vuelve al perfil real

    # --- PERSONALIZACIÓN ---
    PreferenciasUsuario:
      type: object
      required: [hobbies, encuestaCompletada, esCumpleHoy, saludoCumplePendiente]
      properties:
        hobbies:
          type: array
          items:
            type: string
        gustosLibres:
          type: ["string", "null"]
        fechaNacimiento:
          type: ["string", "null"]
          description: Fecha YYYY-MM-DD
        apodo:
          type: ["string", "null"]
        encuestaCompletada:
          type: boolean
        esCumpleHoy:
          type: boolean
        saludoCumplePendiente:
          type: boolean

    PreferenciasUsuarioInput:
      type: object
      required: [hobbies]
      properties:
        hobbies:
          type: array
          items:
            type: string
          maxItems: 20
        gustosLibres:
          type: ["string", "null"]
          maxLength: 500
        fechaNacimiento:
          type: ["string", "null"]
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        apodo:
          type: ["string", "null"]
          maxLength: 60

    # --- USUARIOS (perfiles) ---
    Usuario:
      type: object
      required: [id, email, nombre, rol, activo]
      properties:
        id:
          type: integer
        email:
          type: string
        nombre:
          type: string
        rol:
          type: string
          enum: [admin, recepcionista, medico, paciente]
        perfil:
          type: ["string", "null"]
          enum: [administracion, administrador_caja, tecnico, medico, medico_consulta, medico_informante, medico_consulta_informante, gerente, desarrollador, null]
        profesionalId:
          type: ["integer", "null"]
        activo:
          type: boolean
        createdAt:
          type: string

    UsuarioInput:
      type: object
      required: [email, nombre, password, perfil]
      properties:
        email:
          type: string
          minLength: 3
        nombre:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 4
        perfil:
          type: string
          enum: [administracion, administrador_caja, tecnico, medico_consulta, medico_informante, medico_consulta_informante, gerente, desarrollador]
        profesionalId:
          type: ["integer", "null"]

    UsuarioUpdate:
      type: object
      properties:
        email:
          type: string
          minLength: 3
        nombre:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 4
        perfil:
          type: string
          enum: [administracion, administrador_caja, tecnico, medico_consulta, medico_informante, medico_consulta_informante, gerente, desarrollador]
        profesionalId:
          type: ["integer", "null"]
        activo:
          type: boolean

    # --- SEDES ---
    Sede:
      type: object
      required: [id, nombre, activa]
      properties:
        id:
          type: integer
        nombre:
          type: string
        direccion:
          type: ["string", "null"]
        telefono:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        activa:
          type: boolean
        createdAt:
          type: string
          format: date-time

    SedeInput:
      type: object
      required: [nombre]
      properties:
        nombre:
          type: string
          minLength: 1
        direccion:
          type: string
        telefono:
          type: string
        email:
          type: string
        activa:
          type: boolean

    SedeUpdate:
      type: object
      properties:
        nombre:
          type: string
        direccion:
          type: string
        telefono:
          type: string
        email:
          type: string
        activa:
          type: boolean

    # --- ESPECIALIDADES ---
    Especialidad:
      type: object
      required: [id, nombre]
      properties:
        id:
          type: integer
        nombre:
          type: string
        codigo:
          type: ["string", "null"]
        descripcion:
          type: ["string", "null"]
        color:
          type: ["string", "null"]
        enviaAlPacs:
          type: boolean
        modalidadDicom:
          type: ["string", "null"]

    EspecialidadInput:
      type: object
      required: [nombre]
      properties:
        nombre:
          type: string
          minLength: 1
        codigo:
          type: string
        descripcion:
          type: string
        color:
          type: string
        enviaAlPacs:
          type: boolean
        modalidadDicom:
          type: string

    EspecialidadUpdate:
      type: object
      properties:
        nombre:
          type: string
        codigo:
          type: string
        descripcion:
          type: string
        color:
          type: string
        enviaAlPacs:
          type: boolean
        modalidadDicom:
          type: ["string", "null"]

    # --- PROFESIONALES ---
    Profesional:
      type: object
      required: [id, nombre, activo]
      properties:
        id:
          type: integer
        nombre:
          type: string
        apellido:
          type: ["string", "null"]
        matricula:
          type: ["string", "null"]
        matriculaEspecialista:
          type: ["string", "null"]
        tipoDocumento:
          type: ["string", "null"]
        documento:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        telefono:
          type: ["string", "null"]
        telefonoMovil:
          type: ["string", "null"]
        tipoProfesional:
          type: ["string", "null"]
        sedeId:
          type: ["integer", "null"]
        consultorioId:
          type: ["integer", "null"]
        salaLlamadoId:
          type: ["integer", "null"]
        especialidadId:
          type: ["integer", "null"]
        especialidad:
          $ref: "#/components/schemas/Especialidad"
        activo:
          type: boolean
        atiendeGuardia:
          type: boolean
        aceptaDemandaEspontanea:
          type: boolean
        klinicosUsuario:
          type: ["string", "null"]
        klinicosEspecialidad:
          type: ["string", "null"]
        klinicosSector:
          type: ["string", "null"]
        tieneFirma:
          type: boolean
        createdAt:
          type: string
          format: date-time

    ProfesionalInput:
      type: object
      required: [nombre]
      properties:
        nombre:
          type: string
          minLength: 1
        apellido:
          type: string
        matricula:
          type: string
        matriculaEspecialista:
          type: string
        tipoDocumento:
          type: string
        documento:
          type: string
        email:
          type: string
        telefono:
          type: string
        telefonoMovil:
          type: string
        tipoProfesional:
          type: string
        sedeId:
          type: integer
        consultorioId:
          type: ["integer", "null"]
        salaLlamadoId:
          type: ["integer", "null"]
        especialidadId:
          type: integer
        activo:
          type: boolean
        atiendeGuardia:
          type: boolean
        aceptaDemandaEspontanea:
          type: boolean
        klinicosUsuario:
          type: ["string", "null"]
        klinicosEspecialidad:
          type: ["string", "null"]
        klinicosSector:
          type: ["string", "null"]

    ProfesionalUpdate:
      type: object
      properties:
        nombre:
          type: string
        apellido:
          type: string
        matricula:
          type: string
        matriculaEspecialista:
          type: string
        tipoDocumento:
          type: string
        documento:
          type: string
        email:
          type: string
        telefono:
          type: string
        telefonoMovil:
          type: string
        tipoProfesional:
          type: string
        sedeId:
          type: integer
        consultorioId:
          type: ["integer", "null"]
        salaLlamadoId:
          type: ["integer", "null"]
        especialidadId:
          type: integer
        activo:
          type: boolean
        atiendeGuardia:
          type: boolean
        aceptaDemandaEspontanea:
          type: boolean
        klinicosUsuario:
          type: ["string", "null"]
        klinicosEspecialidad:
          type: ["string", "null"]
        klinicosSector:
          type: ["string", "null"]

    ObraSocial:
      type: object
      required: [id, nombre, activa, visible]
      properties:
        id:
          type: integer
        nombre:
          type: string
        detalle:
          type: ["string", "null"]
        codigo:
          type: ["string", "null"]
        activa:
          type: boolean
        visible:
          type: boolean

    ObraSocialInput:
      type: object
      required: [nombre]
      properties:
        nombre:
          type: string
          minLength: 1
        detalle:
          type: string
        codigo:
          type: string
        activa:
          type: boolean
        visible:
          type: boolean

    NomencladorPractica:
      type: object
      required: [id, obraSocialId, codigo, descripcion, valorTotal]
      properties:
        id:
          type: integer
        obraSocialId:
          type: integer
        codigo:
          type: string
        descripcion:
          type: string
        capitulo:
          type: ["string", "null"]
        honorarios:
          type: ["number", "null"]
        gastos:
          type: ["number", "null"]
        valorTotal:
          type: number
        origen:
          type: ["string", "null"]

    NomencladorListado:
      type: object
      required: [total, practicas]
      properties:
        total:
          type: integer
        practicas:
          type: array
          items:
            $ref: "#/components/schemas/NomencladorPractica"

    Equivalencia:
      type: object
      required: [id, obraSocialId, codigo, pagoTipo, pagoValor]
      properties:
        id:
          type: integer
        obraSocialId:
          type: integer
        codigo:
          type: string
        descripcion:
          type: ["string", "null"]
        cobroObraSocial:
          type: ["number", "null"]
        pagoTipo:
          type: string
          enum: [fijo, porcentaje]
        pagoValor:
          type: number
        valorNomenclador:
          type: ["number", "null"]
        cobroEfectivo:
          type: ["number", "null"]
        pagoCalculado:
          type: ["number", "null"]

    EquivalenciaInput:
      type: object
      required: [obraSocialId, codigo, pagoTipo, pagoValor]
      properties:
        obraSocialId:
          type: integer
        codigo:
          type: string
          minLength: 1
        descripcion:
          type: string
        cobroObraSocial:
          type: number
        pagoTipo:
          type: string
          enum: [fijo, porcentaje]
        pagoValor:
          type: number

    EquivalenciaUpdate:
      type: object
      properties:
        descripcion:
          type: ["string", "null"]
        cobroObraSocial:
          type: ["number", "null"]
        pagoTipo:
          type: string
          enum: [fijo, porcentaje]
        pagoValor:
          type: number

    EquivalenciasListado:
      type: object
      required: [total, equivalencias]
      properties:
        total:
          type: integer
        equivalencias:
          type: array
          items:
            $ref: "#/components/schemas/Equivalencia"

    ObraSocialUpdate:
      type: object
      properties:
        nombre:
          type: string
        detalle:
          type: string
        codigo:
          type: string
        activa:
          type: boolean
        visible:
          type: boolean

    ReporteInfo:
      type: object
      required: [clave, titulo]
      properties:
        clave:
          type: string
        titulo:
          type: string

    ReporteResultado:
      type: object
      required: [clave, titulo, desde, hasta, columnas, filas]
      properties:
        clave:
          type: string
        titulo:
          type: string
        desde:
          type: string
        hasta:
          type: string
        columnas:
          type: array
          items:
            type: string
        filas:
          type: array
          items:
            type: array
            items:
              type: string

    Consultorio:
      type: object
      required: [id, nombre, activo]
      properties:
        id:
          type: integer
        nombre:
          type: string
        detalle:
          type: ["string", "null"]
        activo:
          type: boolean

    ConsultorioInput:
      type: object
      required: [nombre]
      properties:
        nombre:
          type: string
          minLength: 1
        detalle:
          type: string
        activo:
          type: boolean

    ConsultorioUpdate:
      type: object
      properties:
        nombre:
          type: string
        detalle:
          type: string
        activo:
          type: boolean

    SalaLlamado:
