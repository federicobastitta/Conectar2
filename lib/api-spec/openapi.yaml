        turneraId:
          type: integer
        fecha:
          type: string
        horaInicio:
          type: string
        horaFin:
          type: string
        estado:
          type: string
        profesional:
          type: ["string", "null"]
        especialidad:
          type: ["string", "null"]
        sede:
          type: ["string", "null"]

    # --- TURNOS ---
    IngresoConsulta:
      type: object
      required: [turnoId, sector, esConsulta, guardado]
      properties:
        turnoId:
          type: integer
        sector:
          type: string
          description: Sector Klinicos resuelto para el turno (CONSULTORIO, IMAGENES S/C, etc.)
        esConsulta:
          type: boolean
          description: true si el sector es CONSULTORIO (flujo consulta, no practica)
        especialidad:
          type: ["string", "null"]
        profesional:
          type: ["string", "null"]
        motivo:
          type: ["string", "null"]
        token:
          type: ["string", "null"]
        nroBono:
          type: ["string", "null"]
          description: N° de Bono devuelto por Klinicos al autorizar la prestacion con el token, o null
        tokenEstado:
          type: ["string", "null"]
          description: Estado persistido de la validacion del token (valores reales de consultas_token.token_status = NOT_REQUESTED, PENDING, VALIDATING, ACCEPTED, DENIED, EXPIRED, ALREADY_USED, PATIENT_MISMATCH, TECHNICAL_ERROR, TIMEOUT, MANUAL_REVIEW) o null; unica fuente de verdad para el cartel — verde SOLO con ACCEPTED + nroBono no vacio
        guardado:
          type: boolean
          description: true si recepcion ya guardo los datos del ingreso (motivo cargado)
        practicaId:
          type: ["integer", "null"]
          description: Practica del nomenclador IOMA elegida para el turno (klinicos_practicas.id)
        practicaNombre:
          type: ["string", "null"]
        practicaCodigos:
          type: ["array", "null"]
          items:
            type: string
          description: Codigos IOMA de la practica elegida (los usa el Robot para cargar la prestacion)
        practicas:
          type: array
          description: Todos los estudios del turno (turno_practicas), en orden de carga
          items:
            type: object
            required: [id, nombre]
            properties:
              id:
                type: integer
              nombre:
                type: string
              codigos:
                type: array
                items:
                  type: string

    ValidarTokenBody:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 1

    TokenValidacionResultado:
      type: object
      required: [estado, mensaje]
      properties:
        estado:
          type: string
          enum:
            [
              PROCESSING,
              TOKEN_ACCEPTED,
              TOKEN_DENIED,
              TOKEN_EXPIRED,
              TOKEN_ALREADY_USED,
              PATIENT_MISMATCH,
              MANUAL_PRESTATION_REQUIRED,
              DATA_REQUIRED,
              MAPPING_REQUIRED,
              TECHNICAL_ERROR,
              TIMEOUT,
              MANUAL_REVIEW,
            ]
        mensaje:
          type: string
        requestId:
          type: ["string", "null"]
        referenciaKlinicos:
          type: ["string", "null"]
        latenciaMs:
          type: ["integer", "null"]
        reintentable:
          type: boolean
          description: true si es error tecnico/timeout o correccion de datos (no es denegacion) y se puede reintentar con el mismo request_id
        camposFaltantes:
          type: array
          items:
            type: string
          description: Campos a corregir cuando el estado es DATA_REQUIRED
        posicionCola:
          type: ["integer", "null"]
          description: Posicion en la cola del Robot cuando el estado es PROCESSING
        esperaEstimadaSegundos:
          type: ["integer", "null"]
          description: Tiempo estimado de espera en segundos informado por el Robot
        recepcionadoAutomatico:
          type: boolean
          description: true si al validarse el token el paciente quedó recepcionado automáticamente (turno de hoy)
        nroBono:
          type: ["string", "null"]
          description: N° de bono REAL informado por Klinicos al autorizar la prestación con el token; null si Klinicos no lo informó (nunca se inventa)
        autorizacionDetalle:
          type: ["string", "null"]
          description: Motivo por el que la prestación NO quedó autorizada en Klinicos pese al token validado (null si hay bono o el token no fue aceptado)
        pacienteApellido:
          type: ["string", "null"]
          description: Apellido del paciente del turno (para el cartel de validación)
        pacienteNombre:
          type: ["string", "null"]
          description: Nombre del paciente del turno
        contexto:
          $ref: "#/components/schemas/TokenContingenciaContexto"

    TokenContingenciaContexto:
      type: object
      description: Datos para la contingencia de carga manual (MANUAL_PRESTATION_REQUIRED)
      properties:
        paciente:
          type: ["string", "null"]
        dni:
          type: ["string", "null"]
        afiliado:
          type: ["string", "null"]
        fecha:
          type: ["string", "null"]
        practica:
          type: ["string", "null"]
        profesional:
          type: ["string", "null"]
        especialidad:
          type: ["string", "null"]
        sede:
          type: ["string", "null"]
        cie10:
          type: ["string", "null"]
        motivo:
          type: ["string", "null"]
        detalle:
          type: ["string", "null"]

    TokenAccionContingenciaResultado:
      type: object
      required: [ok, tokenStatus]
      properties:
        ok:
          type: boolean
        tokenStatus:
          type: string
        robotSyncStatus:
          type: ["string", "null"]
          description: NOT_SENT | SENDING | PROCESSING | MANUAL_PRESTATION_REQUIRED | READY_TO_RETRY | COMPLETED | ERROR

    TokenAuditoriaEntrada:
      type: object
      required: [tipo, descripcion]
      properties:
        fecha:
          type: ["string", "null"]
        tipo:
          type: string
          description: validacion | accion
        descripcion:
          type: string
        usuario:
          type: ["string", "null"]
        estado:
          type: ["string", "null"]
        requestId:
          type: ["string", "null"]
        referenciaKlinicos:
          type: ["string", "null"]
        latenciaMs:
          type: ["integer", "null"]

    TokenAuditoriaResultado:
      type: object
      required: [entradas]
      properties:
        entradas:
          type: array
          items:
            $ref: "#/components/schemas/TokenAuditoriaEntrada"

    RobotKlinicosEstado:
      type: object
      required: [disponible]
      properties:
        disponible:
          type: boolean
        sesionKlinicos:
          type: ["string", "null"]
          description: activa | inactiva | desconocida
        latenciaMs:
          type: ["integer", "null"]
        motivo:
          type: ["string", "null"]
          description: Motivo legible cuando no esta disponible (ej revisar usuario/clave de Klinicos)
        validacionHabilitada:
          type: boolean
          description: Feature flag KLINICOS_TOKEN_VALIDATION_ENABLED
        consultasProcessHabilitadas:
          type: boolean
          description: Feature flag KLINICOS_CONSULTATIONS_PROCESS_ENABLED (circuito consultations/process, pendiente de OpenAPI del Robot)
        klinicosUrl:
          type: ["string", "null"]
          description: URL institucional segura de KLINICOS (solo https), si esta configurada

    RobotKlinicosPruebaBody:
      type: object
      required: [token, dni]
      properties:
        token:
          type: string
          minLength: 1
        dni:
          type: string
          minLength: 1
          description: Solo digitos
        affiliateNumber:
          type: ["string", "null"]
        diagnosisCode:
          type: ["string", "null"]
          description: CIE-10 opcional, se normaliza antes de enviar
        requestId:
          type: ["string", "null"]
          description: Reusar el request_id de un intento previo (reintento controlado)
        practiceCode:
          type: ["string", "null"]
        professionalId:
          type: ["string", "null"]
        professionalName:
          type: ["string", "null"]
          description: Formato "Apellido, Nombre"
        specialtyCode:
          type: ["string", "null"]
        institutionId:
          type: ["string", "null"]
        patientId:
          type: ["string", "null"]
        consultationId:
          type: ["string", "null"]
          description: Si falta, se genera "prueba-admin-{requestId}"
        documentType:
          type: ["string", "null"]
          description: Tipo de documento (default DNI)

    RobotKlinicosPruebaResultado:
      type: object
      required: [estado, mensaje, requestId]
      properties:
        estado:
          type: string
          description: Estado devuelto por El Robot (TOKEN_ACCEPTED, TOKEN_DENIED, etc.)
        mensaje:
          type: string
        requestId:
          type: string
        referenciaKlinicos:
          type: ["string", "null"]
        latenciaMs:
          type: ["integer", "null"]
        codigo:
          type: ["string", "null"]
          description: reason_code del Robot (PRESTATION_NOT_FOUND) o AUTH_ERROR
        camposFaltantes:
          type: array
          items:
            type: string
          description: missing_fields del Robot en contingencia de carga manual
        numeroAutorizacion:
          type: ["string", "null"]
        noAutenticado:
          type: boolean
          description: true si el Robot rechazo la clave de API (HTTP 401)
        posicionCola:
          type: ["integer", "null"]
          description: Posicion en la cola del Robot cuando el estado es PROCESSING
        esperaEstimadaSegundos:
          type: ["integer", "null"]
          description: Tiempo estimado de espera en segundos informado por el Robot

    RobotKlinicosCatalogoPracticas:
      type: object
      required: [practicas]
      properties:
        practicas:
          type: array
          items:
            type: object
            required: [codigo, descripcion]
            properties:
              codigo:
                type: string
              descripcion:
                type: string
              categoria:
                type: ["string", "null"]

    RobotKlinicosCatalogoProfesionales:
      type: object
      required: [profesionales]
      properties:
        profesionales:
          type: array
          items:
            type: object
            required: [id, nombre]
            properties:
              id:
                type: integer
              nombre:
                type: string
              matricula:
                type: ["string", "null"]
              especialidad:
                type: ["string", "null"]

    RobotKlinicosPrestacionCargadaBody:
      type: object
      required: [requestId]
      properties:
        requestId:
          type: string
          minLength: 1

    RobotKlinicosPrestacionCargadaResultado:
      type: object
      required: [registrado, usuario, fecha]
      properties:
        registrado:
          type: boolean
        usuario:
          type: string
        fecha:
          type: string
          format: date-time

    RobotConsultaProcesoBody:
      type: object
      required: [token, dni, practicaCodigo, diagnosisCode]
      properties:
        token:
          type: string
          minLength: 4
          maxLength: 40
          description: Token IOMA del paciente. NUNCA se guarda ni se loguea.
        dni:
          type: string
          minLength: 1
          description: DNI de un paciente REAL de Conectar (6 a 9 digitos)
        practicaCodigo:
          type: string
          minLength: 1
          description: Codigo del catalogo institucional de practicas KLINICOS (practice.id del contrato)
        diagnosisCode:
          type: string
          minLength: 1
          description: CIE-10 (se valida contra el catalogo institucional)
        diagnosisDescripcion:
          type: ["string", "null"]
        sedeId:
          type: ["integer", "null"]
          description: Sede real de Conectar (site del contrato)
        hora:
          type: ["string", "null"]
          description: HH:mm de la atencion de HOY (hora argentina). Default hora actual.
        cantidad:
          type: ["integer", "null"]
          description: practice.quantity (default 1)
        requestId:
          type: ["string", "null"]
          description: Reenvio del MISMO caso (DATA_REQUIRED / TOKEN_REENTRY_REQUIRED / TECHNICAL_ERROR). Si falta, se genera uno nuevo.
        consultationId:
          type: ["string", "null"]
          description: Consulta de Conectar. Un consultation_id admite UN solo request_id.

    RobotConsultaProcesoResultado:
      type: object
      required: [requestId, consultationId, estado, mensaje, intento]
      properties:
        requestId:
          type: string
        consultationId:
          type: string
        estado:
          type: string
          description: PROCESSING | TOKEN_ACCEPTED | TOKEN_DENIED | DATA_REQUIRED | MAPPING_REQUIRED | MANUAL_REVIEW | TOKEN_REENTRY_REQUIRED | TECHNICAL_ERROR | ERROR_COMUNICACION
        mensaje:
          type: string
        intento:
          type: integer
          description: attempt_number del Robot
        requiereAccionManual:
          type: boolean
        reintentoPermitido:
          type: boolean
        camposFaltantes:
          type: array
          items:
            type: string
          description: missing_fields (solo DATA_REQUIRED, rutas con punto)
        mapeosPendientes:
          type: array
          items:
            type: object
            required: [kind, value, problem]
            properties:
              kind:
                type: string
              value:
                type: string
              problem:
                type: string
          description: mapping_required (solo MAPPING_REQUIRED)
        codigo:
          type: ["string", "null"]
          description: reason_code del Robot
        numeroAutorizacion:
          type: ["string", "null"]
        referenciaKlinicos:
          type: ["string", "null"]
        prestacionCreada:
          type: boolean
        cola:
          type: ["object", "null"]
          properties:
            operacionesPendientes:
              type: ["integer", "null"]
            posicionAproximada:
              type: ["integer", "null"]
            esperaEstimadaSegundos:
              type: ["integer", "null"]
            sesionKlinicosDisponible:
              type: ["boolean", "null"]
          description: Bloque queue del Robot (solo PROCESSING)
        validadoEn:
          type: ["string", "null"]
        latenciaMs:
          type: ["integer", "null"]
        httpStatus:
          type: ["integer", "null"]
          description: HTTP del Robot cuando estado=ERROR_COMUNICACION (409, 429, 503, 0=red)
        claseError:
          type: ["string", "null"]
          description: conflicto | rate_limit | no_autorizado | deshabilitado | no_encontrado | invalido | timeout | red | otro

    ValidarAtencionBody:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 4
          maxLength: 40
        practicaId:
          type: ["string", "null"]
          description: practice.id (codigo con equivalencia aprobada en el Robot); si falta se usa la regla/practica sugerida
        practicaCodigo:
          type: ["string", "null"]
        practicaDescripcion:
          type: ["string", "null"]
        diagnosisCode:
          type: ["string", "null"]
          description: CIE-10; si falta se usa el sugerido (trabajo Klinicos o reglas)
        diagnosisDescripcion:
          type: ["string", "null"]

    ValidacionProcesoTurno:
      type: object
      required: [existe]
      properties:
        existe:
          type: boolean
        proceso:
          $ref: "#/components/schemas/RobotConsultaProcesoResultado"
        practicaSugerida:
          type: ["object", "null"]
          properties:
            id:
              type: ["string", "null"]
            codigo:
              type: ["string", "null"]
            nombre:
              type: ["string", "null"]
        cie10Sugerido:
          type: ["object", "null"]
          properties:
            codigo:
              type: ["string", "null"]
            descripcion:
              type: ["string", "null"]

    PendienteConfiguracionRobot:
      type: object
      required: [requestId, consultationId, estado]
      properties:
        requestId:
          type: string
        consultationId:
          type: string
        turnoId:
          type: ["integer", "null"]
        estado:
          type: string
        paciente:
          type: ["string", "null"]
          description: Apellido y nombre (sin DNI ni afiliado)
        practiceId:
          type: ["string", "null"]
        practiceCode:
          type: ["string", "null"]
        practiceDescripcion:
          type: ["string", "null"]
          description: Descripción de la práctica enviada al Robot
        especialidad:
          type: ["string", "null"]
          description: Especialidad requerida (de la turnera del turno)
        mapeosPendientes:
          type: array
          items:
            type: object
            required: [kind, value, problem]
            properties:
              kind:
                type: string
              value:
                type: string
              problem:
                type: string
        motivo:
          type: ["string", "null"]
        actualizadoEn:
          type: ["string", "null"]

    PendientesConfiguracionResultado:
      type: object
      required: [pendientes]
      properties:
        pendientes:
          type: array
          items:
            $ref: "#/components/schemas/PendienteConfiguracionRobot"

    RobotConsultasSalud:
      type: object
      required: [disponible]
      properties:
        disponible:
          type: boolean
        habilitadoEnRobot:
          type: ["boolean", "null"]
          description: Campo enabled del health del Robot
        sandbox:
          type: ["boolean", "null"]
          description: true = Robot en entorno de simulación (nunca opera KLINICOS real)
        mensaje:
          type: ["string", "null"]
        cola:
          type: ["object", "null"]
          properties:
            operacionesPendientes:
              type: ["integer", "null"]
            posicionAproximada:
              type: ["integer", "null"]
            esperaEstimadaSegundos:
              type: ["integer", "null"]
            sesionKlinicosDisponible:
              type: ["boolean", "null"]
        totalesPorEstado:
          type: object
          additionalProperties:
            type: integer
        timestamp:
          type: ["string", "null"]

    RobotPruebaRealPreflight:
      type: object
      required: [robotDisponible, checks, turnosHoy]
      properties:
        robotDisponible:
          type: boolean
          description: health del Robot respondio 200
        sandbox:
          type: ["boolean", "null"]
          description: Debe ser false para habilitar la prueba real
        habilitadoEnRobot:
          type: ["boolean", "null"]
          description: Campo enabled del health del Robot (flujo real disponible)
        flagRecepcionGeneral:
          type: boolean
          description: KLINICOS_CONSULTATIONS_PROCESS_ENABLED (debe seguir apagado)
        pruebaRealEnCurso:
          type: boolean
          description: Ya hay una prueba real en vuelo (no se permite otra simultanea)
        mensaje:
          type: ["string", "null"]
        checks:
          type: object
          required: [healthOk, modoReal, flujoDisponible, flagApagado, sinPruebaEnCurso]
          properties:
            healthOk:
              type: boolean
            modoReal:
              type: boolean
              description: sandbox === false
            flujoDisponible:
              type: boolean
            flagApagado:
              type: boolean
            sinPruebaEnCurso:
              type: boolean
        turnosHoy:
          type: array
          description: Turnos de HOY candidatos (consulta presencial, paciente IOMA). Sin DNI ni afiliado.
          items:
            type: object
            required: [turnoId, hora, paciente, especialidad, afiliacionCompleta, camposIncompletos]
            properties:
              turnoId:
                type: integer
              hora:
                type: string
              paciente:
                type: string
                description: Apellido, Nombre (sin DNI)
              especialidad:
                type: ["string", "null"]
              sede:
                type: ["string", "null"]
              cobertura:
                type: ["string", "null"]
              estado:
                type: string
              afiliacionCompleta:
                type: boolean
              camposIncompletos:
                type: array
                items:
                  type: string

    RobotPruebaRealBody:
      type: object
      required: [turnoId, practicaId, diagnosisCode, token, confirmacion]
      properties:
        turnoId:
          type: integer
          description: Turno de HOY del paciente presente y autorizado
        practicaId:
          type: string
          minLength: 1
          description: practice.id EXACTO con equivalencia aprobada en el Robot (CONSULTA_GENERAL)
        practicaCodigo:
          type: ["string", "null"]
          description: practice.code informativo (default igual a practicaId)
        practicaDescripcion:
          type: ["string", "null"]
        diagnosisCode:
          type: string
          minLength: 1
          description: CIE-10 (se valida contra el catalogo institucional)
        diagnosisDescripcion:
          type: ["string", "null"]
        token:
          type: string
          minLength: 4
          maxLength: 40
          description: Token IOMA. NUNCA se guarda ni se loguea.
        confirmacion:
          type: boolean
          description: Aceptacion explicita del administrador (segunda confirmacion)
        requestId:
          type: ["string", "null"]
