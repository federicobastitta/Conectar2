          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dni, token]
              properties:
                dni:
                  type: string
                  description: "DNI del paciente dueño del turno (7 a 10 dígitos)"
                token:
                  type: string
                  description: "Token IOMA del día"
      responses:
        "200":
          description: Resultado de la validación (incluye rechazos y errores técnicos)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenValidacionResultado"
        "400":
          description: Datos inválidos
        "401":
          description: Clave de API inválida o faltante
        "404":
          description: Turno no encontrado para ese DNI
