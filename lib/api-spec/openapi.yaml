    # --- API PUBLICA ---
    # --- GUARDIA VIRTUAL ---
    GuardiaVirtualEstadoInfo:
      type: object
      required: [disponible]
      properties:
        disponible:
          type: boolean
        motivo:
          type: string
          nullable: true
        turnosEnEspera:
          type: integer
          nullable: true
        atencionHoy:
          type: integer
          nullable: true
        esperaEstimadaMinutos:
          type: number
          nullable: true
        ofertaPosicion:
          type: integer
          nullable: true
          description: "1=primer lugar, 2=segundo, 3=tercero, null=fila activa (muestra estimado)"
        obrasSociales:
          type: array
          items:
            type: string
          nullable: true

    GuardiaVirtualRegistroInput:
      type: object
      required: [dni, nombre, apellido, cobertura]
      properties:
        dni:
          type: string
          minLength: 7
          maxLength: 10
          pattern: '^\d{7,10}$'
        nombre:
          type: string
          minLength: 1
        apellido:
          type: string
          minLength: 1
        telefono:
          type: string
          nullable: true
        cobertura:
          type: string
          description: "Obra social (debe ser una de las habilitadas, ej. IOMA)"
        modalidad:
          type: string
          enum: [videollamada, presencial]
          description: "presencial = atención por orden de llegada con botón 'Ya llegué' (en pruebas, DNIs habilitados). Default: videollamada."
        guardia:
          type: string
          enum: [clinica, pediatrica]
          description: "Qué guardia: clinica (adultos, default) o pediatrica."

    GuardiaVirtualRegistroResponse:
      type: object
      required: [sesionToken]
      properties:
        sesionToken:
          type: string
          description: "Credencial de polling para el resto de los endpoints"
        modalidad:
          type: string
          enum: [videollamada, presencial]
        guardia:
          type: string
          enum: [clinica, pediatrica]
          nullable: true
          description: "Guardia de la sesión (clinica o pediatrica)"
        posicion:
          type: integer
          nullable: true
          description: "Posición estimada en la fila (1=próximo)"
        esperaEstimadaMinutos:
          type: number
          nullable: true
        ofertaPosicion:
          type: integer
          nullable: true
        reutilizada:
          type: boolean
          nullable: true
          description: "true si ya existía una sesión activa para este DNI"

    GuardiaVirtualValidarTokenInput:
      type: object
      required: [tokenIoma]
      properties:
        tokenIoma:
          type: string
          minLength: 4
          description: "Token de autorización IOMA del día"
        fecha:
          type: string
          nullable: true
          description: "Reserva Check in (solo presencial): fecha del turno YYYY-MM-DD (hoy hasta 3 días adelante). Requiere horaInicio."
        horaInicio:
          type: string
          nullable: true
          description: "Reserva Check in: horario elegido HH:MM (de /publico/guardia-virtual/checkin/disponibilidad)"

    GuardiaVirtualTokenValidacion:
      type: object
      required: [estado, reintentable]
      properties:
        estado:
          type: string
          enum: [TOKEN_ACCEPTED, DENIED, TECHNICAL_ERROR, TIMEOUT, NO_CONFIGURADO]
        mensaje:
          type: string
          nullable: true
        nroBono:
          type: string
          nullable: true
        reintentable:
          type: boolean
        turnoFecha:
          type: string
          nullable: true
          description: "Fecha del turno creado (YYYY-MM-DD); en reservas Check in es la fecha elegida"
        turnoHora:
          type: string
          nullable: true
          description: "Hora del turno Check in reservado (HH:MM); null si entró a la fila de hoy por orden de llegada"

    BuscadorAgendaRef:
      type: object
      required: [turneraId, turneraNombre, esGuardia]
      properties:
        turneraId:
          type: integer
        turneraNombre:
          type: string
        profesionalNombre:
          type: string
          nullable: true
        especialidadId:
          type: integer
          nullable: true
        especialidadNombre:
          type: string
          nullable: true
        sedeId:
          type: integer
          nullable: true
        sedeNombre:
          type: string
          nullable: true
        esGuardia:
          type: boolean
        tipo:
          type: string
          nullable: true

    BuscadorAgendasResultado:
      type: object
      required: [practicas, especialidades]
      properties:
        practicas:
          type: array
          items:
            type: object
            required: [codigo, descripcion, agendas]
            properties:
              codigo:
                type: string
              descripcion:
                type: string
              agendas:
                type: array
                items:
                  $ref: "#/components/schemas/BuscadorAgendaRef"
        especialidades:
          type: array
          items:
            type: object
            required: [id, nombre, agendas]
            properties:
              id:
                type: integer
              nombre:
                type: string
              agendas:
                type: array
                items:
                  $ref: "#/components/schemas/BuscadorAgendaRef"

    PublicoGuardiaInfo:
      type: object
      required: [id, nombre, diasAtencion, horaInicio, horaFin, abiertaAhora]
      properties:
        id:
          type: integer
        nombre:
          type: string
        especialidadId:
          type: integer
          nullable: true
        especialidadNombre:
          type: string
          nullable: true
