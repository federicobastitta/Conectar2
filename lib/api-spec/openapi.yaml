        pacienteDni:
          type: string
        pacienteNombre:
          type: string
        pacienteApellido:
          type: string
        fecha:
          type: string
          format: date
        horaInicio:
          type: string
        modalidad:
          type: string
          enum: [presencial, videoconsulta]
        motivoConsulta:
          type: string
        regionAnatomica:
          type: string
          description: Región anatómica / parte del cuerpo del estudio. Obligatoria si la turnera es de práctica.
        observaciones:
          type: string
        cobertura:
          type: string
        nroAfiliado:
          type: string
        sobreturno:
