      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: fecha
          in: path
          required: true
          description: Fecha YYYY-MM-DD
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Slot"
        "401":
          description: Clave de API inválida o faltante
        "404":
          description: Agenda no encontrada

  /publico/turneras/{id}/disponibilidad:
    get:
      operationId: publicoGetDisponibilidadRango
      tags: [publico]
      summary: Slots disponibles de una agenda agrupados por fecha (rango hasta 31 días, API pública, requiere x-api-key)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: fechaDesde
          in: query
          required: true
          description: Fecha de inicio del rango (YYYY-MM-DD, inclusive)
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: fechaHasta
          in: query
          required: true
          description: Fecha de fin del rango (YYYY-MM-DD, inclusive). Máximo 31 días desde fechaDesde.
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        "200":
          description: Slots agrupados por fecha. Solo se incluyen fechas con al menos un slot. Fechas pasadas y días sin atención se omiten.
          content:
            application/json:
              schema:
                type: object
                required: [fechaDesde, fechaHasta, dias]
                properties:
                  fechaDesde:
                    type: string
                  fechaHasta:
                    type: string
                  dias:
                    type: object
                    description: Claves son fechas YYYY-MM-DD; solo aparecen fechas con al menos un slot.
                    additionalProperties:
                      type: array
                      items:
                        type: object
                        required: [horaInicio, horaFin, disponible]
                        properties:
                          horaInicio:
                            type: string
                          horaFin:
                            type: string
                          disponible:
                            type: boolean
        "400":
          description: Parámetros inválidos (formato de fecha, rango > 31 días, fechaHasta < fechaDesde)
        "401":
          description: Clave de API inválida o faltante
        "404":
          description: Agenda no encontrada o sin visibilidad online

